<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
  <title id="title">Task 3 investigation flow</title>
  <desc id="desc">The Task 3 investigation moves from target analysis and a frozen split through controlled architecture comparison, imbalance treatment, robustness evaluation, and a deployment-aware judgement.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#475569"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1500" height="560" rx="26" fill="#f8fafc"/>
  <text x="750" y="52" text-anchor="middle" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#0f172a">Task 3: evidence flows into one model decision</text>
  <text x="750" y="84" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#475569">Each stage answers a question raised by the previous result</text>
  <g font-family="Segoe UI,Arial" text-anchor="middle" filter="url(#shadow)">
    <g><rect x="45" y="155" width="210" height="190" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="150" y="195" font-size="20" font-weight="700" fill="#075985">Target audit</text><text x="150" y="233" font-size="17" font-weight="700" fill="#0f172a">5 gender classes</text><text x="150" y="263" font-size="17" font-weight="700" fill="#0f172a">8 usage classes</text><text x="150" y="301" font-size="15" fill="#475569">Home has only</text><text x="150" y="326" font-size="21" font-weight="700" fill="#b91c1c">1 image</text></g>
    <g><rect x="285" y="155" width="210" height="190" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="390" y="195" font-size="20" font-weight="700" fill="#155e75">Frozen split</text><text x="390" y="238" font-size="19" font-weight="700" fill="#0f172a">37,745 rows</text><text x="390" y="270" font-size="17" fill="#0f172a">15% validation</text><text x="390" y="307" font-size="15" fill="#475569">One file keeps every</text><text x="390" y="330" font-size="15" fill="#475569">comparison aligned</text></g>
    <g><rect x="525" y="135" width="230" height="230" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="640" y="178" font-size="20" font-weight="700" fill="#5b21b6">Controlled designs</text><text x="640" y="218" font-size="18" font-weight="700" fill="#0f172a">A: two models</text><text x="640" y="250" font-size="18" font-weight="700" fill="#0f172a">B: joint label</text><text x="640" y="282" font-size="18" font-weight="700" fill="#0f172a">C: shared body</text><text x="640" y="323" font-size="15" fill="#475569">Same body, rows, seed</text><text x="640" y="346" font-size="15" fill="#475569">and training schedule</text></g>
    <g><rect x="785" y="155" width="210" height="190" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="890" y="195" font-size="20" font-weight="700" fill="#92400e">Tail intervention</text><text x="890" y="238" font-size="18" font-weight="700" fill="#0f172a">1 / √n weighting</text><text x="890" y="274" font-size="18" font-weight="700" fill="#166534">+0.061 to +0.081</text><text x="890" y="300" font-size="15" fill="#475569">usage macro-F1</text><text x="890" y="329" font-size="15" fill="#475569">across two platforms</text></g>
    <g><rect x="1025" y="135" width="230" height="230" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1140" y="178" font-size="20" font-weight="700" fill="#991b1b">Robustness tests</text><text x="1140" y="220" font-size="17" font-weight="700" fill="#0f172a">Random validation</text><text x="1140" y="252" font-size="17" font-weight="700" fill="#0f172a">Forward high-ID split</text><text x="1140" y="284" font-size="17" font-weight="700" fill="#0f172a">261 external photos</text><text x="1140" y="326" font-size="15" fill="#475569">Separates selection,</text><text x="1140" y="349" font-size="15" fill="#475569">temporal and domain shift</text></g>
    <g><rect x="1285" y="155" width="170" height="190" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1370" y="195" font-size="20" font-weight="700" fill="#166534">Judgement</text><text x="1370" y="238" font-size="18" font-weight="700" fill="#0f172a">C + weighting</text><text x="1370" y="270" font-size="18" font-weight="700" fill="#0f172a">+ mirror TTA</text><text x="1370" y="308" font-size="21" font-weight="700" fill="#166534">289,133</text><text x="1370" y="331" font-size="15" fill="#475569">parameters</text></g>
  </g>
  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M255 250 H278"/><path d="M495 250 H518"/><path d="M755 250 H778"/><path d="M995 250 H1018"/><path d="M1255 250 H1278"/></g>
  <rect x="265" y="420" width="970" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="750" y="453" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#0f172a">Final choice is not the highest single validation score</text>
  <text x="750" y="480" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#475569">It combines repeatability, tail improvement, parameter cost and performance under distribution shift.</text>
</svg>
