<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
  <title id="title">Three evaluation distributions for Task 3</title>
  <desc id="desc">Random validation supports model development, a forward high-ID split approximates the graded test distribution, and independent photographs reveal domain and label-prior shift.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#475569"/></marker></defs>
  <rect width="1500" height="600" rx="26" fill="#f8fafc"/>
  <text x="750" y="54" text-anchor="middle" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#0f172a">One model, three increasingly difficult evaluation conditions</text>
  <text x="750" y="88" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#475569">The score drop identifies what random validation hides</text>
  <g font-family="Segoe UI,Arial" text-anchor="middle">
    <g><rect x="80" y="145" width="370" height="330" rx="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="265" y="190" font-size="24" font-weight="700" fill="#075985">Random validation</text><text x="265" y="230" font-size="17" fill="#0f172a">Same catalogue and mixed ID range</text><text x="265" y="272" font-size="16" fill="#475569">Used for model development</text><text x="265" y="316" font-size="17" fill="#0f172a">gender macro-F1</text><text x="265" y="352" font-size="34" font-weight="700" fill="#0f172a">0.717</text><text x="265" y="398" font-size="17" fill="#0f172a">usage macro-F1</text><text x="265" y="434" font-size="34" font-weight="700" fill="#0f172a">0.407</text></g>
    <g><rect x="565" y="145" width="370" height="330" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="750" y="190" font-size="24" font-weight="700" fill="#92400e">Forward high-ID split</text><text x="750" y="230" font-size="17" fill="#0f172a">Matches the graded test-set direction</text><text x="750" y="272" font-size="16" fill="#475569">Tests catalogue drift over ID</text><text x="750" y="316" font-size="17" fill="#0f172a">gender macro-F1</text><text x="750" y="352" font-size="34" font-weight="700" fill="#b45309">0.579</text><text x="750" y="398" font-size="17" fill="#0f172a">usage macro-F1</text><text x="750" y="434" font-size="34" font-weight="700" fill="#b45309">0.359</text></g>
    <g><rect x="1050" y="125" width="370" height="370" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1235" y="170" font-size="24" font-weight="700" fill="#991b1b">261 external photos</text><text x="1235" y="210" font-size="17" fill="#0f172a">New sources, framing and backgrounds</text><text x="1235" y="246" font-size="16" fill="#475569">Domain shift + deliberately changed priors</text><text x="1235" y="294" font-size="17" fill="#0f172a">gender macro-F1</text><text x="1235" y="330" font-size="34" font-weight="700" fill="#b91c1c">0.131</text><text x="1235" y="376" font-size="17" fill="#0f172a">usage macro-F1</text><text x="1235" y="412" font-size="34" font-weight="700" fill="#b91c1c">0.116</text><text x="1235" y="460" font-size="15" font-weight="700" fill="#991b1b">Casual F1: 0.933 → 0.746</text></g>
  </g>
  <g stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M450 310 H555"/><path d="M935 310 H1040"/></g>
  <text x="505" y="292" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#475569">time / ID shift</text>
  <text x="990" y="292" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#475569">image domain shift</text>
  <rect x="270" y="525" width="960" height="48" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="750" y="556" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#475569">Random validation selects the model; forward and external evaluations test whether that decision survives a changed distribution.</text>
</svg>
