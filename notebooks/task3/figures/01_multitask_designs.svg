<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="690" viewBox="0 0 1500 690" role="img" aria-labelledby="title desc">
  <title id="title">Three designs for predicting gender and usage</title>
  <desc id="desc">Design A duplicates the backbone, design B predicts sparse joint labels, and design C shares one backbone with two target-specific heads.</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#475569"/></marker></defs>
  <rect width="1500" height="690" rx="26" fill="#f8fafc"/>
  <text x="750" y="52" text-anchor="middle" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#0f172a">The design question is where the two targets should share information</text>
  <text x="750" y="84" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#475569">All three candidates use the same convolutional body and training protocol</text>
  <g font-family="Segoe UI,Arial">
    <g><rect x="40" y="120" width="440" height="430" rx="22" fill="#ffffff" stroke="#0284c7" stroke-width="3"/><text x="260" y="164" text-anchor="middle" font-size="25" font-weight="700" fill="#075985">A — two independent models</text><rect x="76" y="220" width="92" height="86" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="122" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">image</text><text x="122" y="279" text-anchor="middle" font-size="14" fill="#475569">60 × 80</text><rect x="225" y="190" width="130" height="76" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="290" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">backbone 1</text><text x="290" y="246" text-anchor="middle" font-size="13" fill="#475569">gender features</text><rect x="225" y="310" width="130" height="76" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="290" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">backbone 2</text><text x="290" y="366" text-anchor="middle" font-size="13" fill="#475569">usage features</text><rect x="390" y="198" width="60" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="420" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">5</text><rect x="390" y="318" width="60" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="420" y="352" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">8</text><g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M168 250 L218 228"/><path d="M168 276 L218 348"/><path d="M355 228 H383"/><path d="M355 348 H383"/></g><text x="260" y="446" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">576,589 parameters</text><text x="260" y="482" text-anchor="middle" font-size="16" fill="#475569">Best gender macro-F1, but duplicates</text><text x="260" y="506" text-anchor="middle" font-size="16" fill="#475569">99.4% of the computation.</text></g>
    <g><rect x="530" y="120" width="440" height="430" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="750" y="164" text-anchor="middle" font-size="25" font-weight="700" fill="#5b21b6">B — one joint label</text><rect x="570" y="260" width="92" height="86" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="616" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">image</text><text x="616" y="319" text-anchor="middle" font-size="14" fill="#475569">60 × 80</text><rect x="710" y="260" width="130" height="86" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="775" y="295" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">one backbone</text><text x="775" y="319" text-anchor="middle" font-size="13" fill="#475569">shared features</text><rect x="885" y="260" width="58" height="86" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="914" y="296" text-anchor="middle" font-size="18" font-weight="700" fill="#6b21a8">24</text><text x="914" y="320" text-anchor="middle" font-size="12" fill="#6b21a8">pairs</text><g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M662 303 H703"/><path d="M840 303 H878"/></g><text x="750" y="414" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">290,552 parameters</text><text x="750" y="451" text-anchor="middle" font-size="16" fill="#475569">Crossing the labels creates</text><text x="750" y="481" text-anchor="middle" font-size="19" font-weight="700" fill="#b91c1c">6 combinations below 10 rows</text><text x="750" y="507" text-anchor="middle" font-size="16" fill="#475569">and 16 combinations absent from train.</text></g>
    <g><rect x="1020" y="120" width="440" height="430" rx="22" fill="#ffffff" stroke="#16a34a" stroke-width="4"/><text x="1240" y="164" text-anchor="middle" font-size="25" font-weight="700" fill="#166534">C — shared body, two heads</text><rect x="1055" y="260" width="92" height="86" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="1101" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">image</text><text x="1101" y="319" text-anchor="middle" font-size="14" fill="#475569">60 × 80</text><rect x="1190" y="260" width="135" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1257" y="295" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">shared body</text><text x="1257" y="319" text-anchor="middle" font-size="13" fill="#475569">128 features</text><rect x="1370" y="214" width="60" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1400" y="248" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">5</text><rect x="1370" y="334" width="60" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1400" y="368" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">8</text><g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M1147 303 H1183"/><path d="M1325 290 L1363 246"/><path d="M1325 316 L1363 360"/></g><text x="1240" y="434" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">289,133 parameters</text><text x="1240" y="470" text-anchor="middle" font-size="16" fill="#475569">The second output costs only</text><text x="1240" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">1,032 parameters</text></g>
  </g>
  <rect x="300" y="590" width="900" height="66" rx="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="618" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#166534">Selected: C + class-weighted usage loss</text>
  <text x="750" y="643" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#475569">It accepts about 0.02 lower gender macro-F1 to gain about 0.06–0.08 on usage at half the parameter cost of A.</text>
</svg>
