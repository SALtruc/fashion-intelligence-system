<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="400" viewBox="0 0 1220 400" role="img" aria-labelledby="title desc">
<title id="title">ArcFace HPO evidence gate</title>
<desc id="desc">Why the saved parameter screen is documented but not visualised as a matched Optuna result</desc>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#183153}
.title{font-size:25px;font-weight:700}.subtitle{font-size:15px;fill:#667085}
.panel{font-size:17px;font-weight:700}.axis{font-size:13px;fill:#667085}
.note{font-size:13px;fill:#475467}.grid{stroke:#d7dee8;stroke-width:1}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#e07a3f"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#ffffff" stroke="#d7dee8"/>
<text class="title" x="34" y="38">ArcFace HPO evidence gate</text>
<text class="subtitle" x="34" y="61">Why the saved parameter screen is documented but not visualised as a matched Optuna result</text>
<rect x="45" y="135" width="240" height="118" rx="14" fill="#eef4f8" stroke="#128a8a" stroke-width="2"/>
<text x="63" y="171" font-size="15" font-weight="700">Saved HPO screen</text>
<text class="note" x="63" y="202">Encoder updated;</text>
<text class="note" x="63" y="222">class centres fixed</text>
<path d="M 287 194 L 333 194" stroke="#e07a3f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="340" y="135" width="240" height="118" rx="14" fill="#eef4f8" stroke="#128a8a" stroke-width="2"/>
<text x="358" y="171" font-size="15" font-weight="700">Validity check</text>
<text class="note" x="358" y="202">Training dynamics differ</text>
<text class="note" x="358" y="222">from final fit</text>
<path d="M 582 194 L 628 194" stroke="#e07a3f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="635" y="135" width="240" height="118" rx="14" fill="#eef4f8" stroke="#128a8a" stroke-width="2"/>
<text x="653" y="171" font-size="15" font-weight="700">Current decision</text>
<text class="note" x="653" y="202">Use parameters</text>
<text class="note" x="653" y="222">as approximate screen</text>
<path d="M 877 194 L 923 194" stroke="#e07a3f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="930" y="135" width="240" height="118" rx="14" fill="#eef4f8" stroke="#128a8a" stroke-width="2"/>
<text x="948" y="171" font-size="15" font-weight="700">Required next run</text>
<text class="note" x="948" y="202">Optimise encoder +</text>
<text class="note" x="948" y="222">centres, then plot</text>
<text class="note" x="610" y="310" text-anchor="middle">No optimization-history or parameter-effect claim is shown until the objective matches final ArcFace training.</text>
</svg>