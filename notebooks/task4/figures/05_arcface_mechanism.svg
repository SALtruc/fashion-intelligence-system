<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
  <title id="title">ArcFace angular-margin mechanism</title>
  <desc id="desc">Normalized embeddings and class weights lie on a hypersphere. ArcFace adds a margin to the target angle before scaled softmax.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="310" rx="18" fill="#f8fafc"/>
  <text x="480" y="32" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#0f172a">ArcFace: classify by angle and reserve an explicit angular margin</text>
  <g font-family="Segoe UI,Arial" fill="#0f172a">
    <circle cx="250" cy="167" r="105" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <line x1="250" y1="167" x2="330" y2="99" stroke="#2563eb" stroke-width="3"/><line x1="250" y1="167" x2="159" y2="114" stroke="#dc2626" stroke-width="3"/><line x1="250" y1="167" x2="307" y2="129" stroke="#16a34a" stroke-width="3"/>
    <circle cx="330" cy="99" r="10" fill="#2563eb"/><circle cx="159" cy="114" r="10" fill="#dc2626"/><circle cx="307" cy="129" r="10" fill="#16a34a"/>
    <text x="346" y="96" font-size="14">class centre Wᵧ</text><text x="98" y="108" font-size="14">other centre Wⱼ</text><text x="317" y="145" font-size="14">embedding x</text>
    <path d="M286 136 A48 48 0 0 1 301 154" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="307" y="176" font-size="14" fill="#6d28d9">θᵧ</text>
    <rect x="455" y="68" width="190" height="75" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="550" y="98" text-anchor="middle" font-size="15" font-weight="700">Normalize x and W</text><text x="550" y="122" text-anchor="middle" font-size="14">logit = cos(θ)</text>
    <rect x="455" y="180" width="190" height="75" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="550" y="210" text-anchor="middle" font-size="15" font-weight="700">Target class only</text><text x="550" y="234" text-anchor="middle" font-size="14">cos(θᵧ + m)</text>
    <rect x="720" y="124" width="190" height="75" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="815" y="154" text-anchor="middle" font-size="15" font-weight="700">Scale by s</text><text x="815" y="178" text-anchor="middle" font-size="14">softmax cross-entropy</text>
  </g>
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M360 135 H447"/><path d="M550 145 V174"/><path d="M650 217 C690 217 675 162 713 162"/></g>
  <text x="480" y="291" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#475569">At inference the class-centre head is removed; cosine search uses the normalized encoder embedding.</text>
</svg>
