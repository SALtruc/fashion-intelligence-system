<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Supervised contrastive learning mechanism</title>
  <desc id="desc">Two views of each image are encoded together. Every same-class view is positive for an anchor and all other-class views are negatives.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="300" rx="18" fill="#f8fafc"/>
  <text x="480" y="32" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#0f172a">SupCon: one anchor learns from every labelled view in the batch</text>
  <g font-family="Segoe UI,Arial" font-size="14" fill="#0f172a" text-anchor="middle">
    <rect x="28" y="80" width="145" height="96" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="100" y="116" font-weight="700">P-K batch</text><text x="100" y="142">16 classes × 4</text>
    <rect x="220" y="66" width="155" height="124" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="297" y="103" font-weight="700">Two views</text><text x="297" y="130">mild independent</text><text x="297" y="153">augmentations</text>
    <rect x="425" y="80" width="135" height="96" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="492" y="116" font-weight="700">Shared encoder</text><text x="492" y="142">128 embeddings</text>
    <rect x="610" y="58" width="320" height="144" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="700" cy="130" r="15" fill="#2563eb"/><text x="700" y="166">anchor</text>
    <circle cx="735" cy="101" r="12" fill="#16a34a"/><circle cx="760" cy="145" r="12" fill="#16a34a"/><circle cx="675" cy="92" r="12" fill="#16a34a"/>
    <circle cx="855" cy="91" r="12" fill="#dc2626"/><circle cx="875" cy="145" r="12" fill="#dc2626"/><circle cx="820" cy="165" r="12" fill="#dc2626"/>
    <text x="745" y="225" fill="#16a34a">same label: attract</text><text x="858" y="225" fill="#dc2626">other labels: repel</text>
  </g>
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M173 128 H215"/><path d="M375 128 H420"/><path d="M560 128 H605"/></g>
  <g stroke="#16a34a" stroke-width="2"><line x1="712" y1="119" x2="726" y2="108"/><line x1="713" y1="136" x2="748" y2="143"/><line x1="690" y1="117" x2="681" y2="104"/></g>
  <g stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"><line x1="715" y1="124" x2="842" y2="95"/><line x1="715" y1="135" x2="863" y2="145"/><line x1="711" y1="142" x2="808" y2="162"/></g>
  <text x="480" y="274" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#475569">With 4 samples/class and 2 views/sample, each anchor has 7 positive views rather than one.</text>
</svg>
