[project]
name = "Machine-Learning-Assignment-2"
version = "0.1.0"
description = "Assignment 2 for COSC2753 - Machine Learning"
readme = "README.md"
requires-python = "==3.12.0"
dependencies = [
    "jupyter",
    "joblib",
    "numpy",
    "pandas",
    "pillow",
    "iterative-stratification",
    "optuna",
    "tqdm",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "torch",
    "torchvision",
    "faiss-cpu; sys_platform == 'win32'",
    "faiss-gpu; sys_platform == 'linux'",
    "pytorch-metric-learning",
    "notebook>=7.6.2",
    "scikit-image>=0.26.0",
    "transformers>=4.57,<5",
    "timm>=1.0.29",
    "accelerate>=1.15.0",
    "safetensors>=0.8.0",
]

# pyflakes is a development-only linter for notebook source. Nothing in the repository runs
# it automatically now that the notebook generators are gone; it is kept because removing it
# would require regenerating `uv.lock`, which `uv sync --frozen` verifies against.
# `uv sync` installs this group by default.
[dependency-groups]
dev = [
    "pyflakes>=3.4.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
# Used only for the packages that name it in [tool.uv.sources]. Without this uv resolves every
# package against this index first, and it carries an old `requests` that nothing else can
# satisfy, so any change to the dependencies fails to re-resolve.
explicit = true
