[project]
name = "Machine-Learning-Assignment-2"
version = "0.1.0"
description = "Assignment 2 for COSC2753 - Machine Learning"
readme = "README.md"
requires-python = "==3.12.0"
dependencies = [
    "numpy",
    "pandas",
    "iterative-stratification",
    "optuna",
    "tqdm",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "torch",
    "torchvision",
    "faiss-cpu",
    "notebook>=7.6.2",
    "scikit-image>=0.26.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
